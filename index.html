
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Quiz App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-lg bg-slate-800 rounded-2xl p-6 shadow-xl border border-slate-700">

    <!-- 1. Màn hình Start -->
    <div id="start-screen" class="text-center space-y-4">
      <h1 class="text-3xl font-bold text-indigo-400">Frontend Quiz Challenge</h1>
      <p class="text-slate-300">Thử thách kiến thức JS & CSS của bạn. Mỗi câu hỏi có 60 giây để trả lời!</p>
      <button id="start-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl transition">
        Bắt đầu làm bài
      </button>
    </div>

    <!-- 2. Màn hình Quiz (Mặc định ẩn) -->
     <div id="quiz-screen" class=" hidden space-y-6">
        <div class="flex justify-between items-center text-sm text-slate-400 border-b border-slate-700 pb-3">
            <span>Diem: <strong id="score-display" class="text-indigo-400 text-base">0</strong></span>
            <span>Thời gian: <strong id="timer-display" class="text-amber-400 text-base">60s</strong></span>
        </div>
        <div>
            <span id="question-number" class="text-xs text-indigo-400 font-semibold uppercase" >Câu hỏi 1/3</span>
            <h2 id="question-text" class="text-xl font-medium mt-1">Câu hỏi mẫu sẽ hiện ở đây?</h2>
        </div>
        <!-- Nơi chứa các nút đáp án -->
         <div id="options-container" class="space-y-3"></div>
         <button id="next-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl tradition">
            Câu tiếp theo ➔
         </button>
     </div>
     <!-- 3. Màn hình Kết quả (Đang ẩn với class hidden) -->
      <div id="end-screen" class="hidden text-center space-y-4">
        <h2 class="text-2xl font-bold text-indigo-400">Hoàn thành bài thi!</h2>
        <p class="text-slate-300">Điểm số của bạn:</p>
        <div id="final-score" class="text-5xl font-extrabold text-amber-400 py-2">0</div>
        <button id="restart-btn" class="w-full py-3 bg-slate-700 hover:bg-slate-600 font-semibold rounded-xl tradition">
            Làm lại bài
        </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
